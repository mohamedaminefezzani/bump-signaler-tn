<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dosser TN — Speed Bump Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.3.3/typescript.min.js"></script>
<style>
  :root {
    --black: #0D0D0D;
    --white: #F7F6F2;
    --yellow: #F5C842;
    --yellow-dark: #D4A820;
    --red: #E8432D;
    --orange: #F08C3A;
    --green: #2DB87A;
    --grey-1: #1A1A1A;
    --grey-2: #2A2A2A;
    --grey-3: #444;
    --grey-4: #888;
    --grey-5: #BBB;
    --panel-w: 380px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Space Grotesk', sans-serif; background: var(--black); color: var(--white); overflow: hidden; }

  /* ── Layout ── */
  #app { display: flex; height: 100%; }
  #map { flex: 1; height: 100%; z-index: 1; }
  #panel {
    width: var(--panel-w);
    height: 100%;
    background: var(--grey-1);
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--grey-2);
    z-index: 10;
    overflow: hidden;
  }

  /* ── Header ── */
  #header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--grey-2);
    flex-shrink: 0;
  }
  #header .logo {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--yellow);
    letter-spacing: -0.5px;
    line-height: 1;
  }
  #header .logo span { color: var(--white); }
  #header .tagline {
    font-size: 12px;
    color: var(--grey-4);
    margin-top: 4px;
    font-weight: 400;
  }
  #bump-count {
    margin-top: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--grey-4);
  }
  #bump-count strong { color: var(--yellow); font-size: 20px; display: block; line-height: 1; }

  /* ── Tabs ── */
  #tabs {
    display: flex;
    border-bottom: 1px solid var(--grey-2);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 12px;
    background: none;
    border: none;
    color: var(--grey-4);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: color .15s, border-bottom .15s;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--yellow); border-bottom: 2px solid var(--yellow); }
  .tab:hover:not(.active) { color: var(--white); }

  /* ── Tab content ── */
  .tab-content { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
  .tab-content.active { display: flex; }

  /* ── Feed ── */
  #feed { padding: 12px; gap: 10px; }
  .bump-card {
    background: var(--grey-2);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: background .15s;
    border: 1px solid transparent;
  }
  .bump-card:hover { background: var(--grey-3); border-color: var(--grey-3); }
  .bump-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .bump-card .no-photo {
    width: 100%; height: 80px;
    background: var(--grey-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .bump-card .card-body { padding: 10px 12px 12px; }
  .bump-card .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .severity-badge {
    font-size: 10px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .sev-small { background: #1a3a2a; color: var(--green); }
  .sev-medium { background: #3a2a10; color: var(--orange); }
  .sev-large { background: #3a1510; color: var(--red); }
  .card-date { font-size: 10px; color: var(--grey-4); font-family: 'Space Mono', monospace; }
  .card-desc { font-size: 13px; color: var(--grey-5); line-height: 1.4; }
  .card-coords { font-size: 10px; color: var(--grey-3); font-family: 'Space Mono', monospace; margin-top: 6px; }

  .empty-feed {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center; gap: 12px;
  }
  .empty-feed .icon { font-size: 48px; opacity: .4; }
  .empty-feed p { font-size: 14px; color: var(--grey-4); line-height: 1.5; }

  /* ── Form ── */
  #form-content { padding: 20px 20px; gap: 16px; }
  .form-section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--grey-4);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--white); }
  .field input, .field textarea, .field select {
    background: var(--grey-2);
    border: 1px solid var(--grey-3);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s;
    width: 100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--yellow); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select option { background: var(--grey-2); }

  /* GPS row */
  .gps-row { display: flex; gap: 8px; align-items: flex-end; }
  .gps-row .field { flex: 1; }
  #btn-gps {
    background: var(--grey-2);
    border: 1px solid var(--grey-3);
    border-radius: 6px;
    color: var(--yellow);
    padding: 10px 12px;
    cursor: pointer;
    font-size: 18px;
    transition: background .15s, border-color .15s;
    flex-shrink: 0;
    height: 42px;
    display: flex; align-items: center;
  }
  #btn-gps:hover { background: var(--grey-3); border-color: var(--yellow); }

  /* Photo upload */
  #photo-drop {
    border: 2px dashed var(--grey-3);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  #photo-drop:hover, #photo-drop.dragover { border-color: var(--yellow); background: rgba(245,200,66,.05); }
  #photo-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  #photo-drop .drop-icon { font-size: 32px; margin-bottom: 8px; }
  #photo-drop p { font-size: 13px; color: var(--grey-4); }
  #photo-drop p strong { color: var(--yellow); }
  #photo-preview { width: 100%; border-radius: 6px; margin-top: 8px; display: none; max-height: 180px; object-fit: cover; }

  /* Submit btn */
  #btn-submit {
    background: var(--yellow);
    color: var(--black);
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background .15s, transform .1s;
    margin-top: 4px;
  }
  #btn-submit:hover { background: var(--yellow-dark); }
  #btn-submit:active { transform: scale(.98); }
  #btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* Status messages */
  #status {
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 6px;
    display: none;
    font-weight: 500;
  }
  #status.success { background: #1a3a2a; color: var(--green); display: block; }
  #status.error { background: #3a1510; color: var(--red); display: block; }
  #status.info { background: #2a2a10; color: var(--yellow); display: block; }

  /* Map pin tip */
  #map-tip {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(13,13,13,.92);
    border: 1px solid var(--yellow);
    color: var(--yellow);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 20px;
    z-index: 999;
    display: none;
    pointer-events: none;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }

  /* Leaflet custom marker */
  .bump-marker {
    width: 28px; height: 28px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(0,0,0,.3);
  }
  .bump-marker.small { background: var(--green); }
  .bump-marker.medium { background: var(--orange); }
  .bump-marker.large { background: var(--red); }
  .bump-marker-inner { transform: rotate(45deg); font-size: 12px; }

  /* Popup */
  .leaflet-popup-content-wrapper {
    background: var(--grey-1) !important;
    color: var(--white) !important;
    border: 1px solid var(--grey-2) !important;
    border-radius: 8px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,.5) !important;
  }
  .leaflet-popup-tip { background: var(--grey-1) !important; }
  .popup-img { width: 100%; border-radius: 4px; margin-bottom: 8px; max-height: 140px; object-fit: cover; }
  .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .popup-desc { font-size: 12px; color: var(--grey-5); line-height: 1.4; }
  .popup-meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .popup-date { font-size: 10px; color: var(--grey-4); font-family: 'Space Mono', monospace; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--grey-3); border-radius: 2px; }

  /* Mobile */
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #map { flex: 1; min-height: 45vh; }
    #panel { width: 100%; height: 55vh; border-left: none; border-top: 1px solid var(--grey-2); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="map-tip">📍 Click on the map to place the bump</div>
  </div>
  <div id="panel">
    <div id="header">
      <div class="logo">DOSSER<span>.TN</span></div>
      <div class="tagline">Speed bump map — by the people, for the people</div>
      <div id="bump-count"><strong id="count-num">—</strong> bumps reported</div>
    </div>
    <div id="tabs">
      <button class="tab active" onclick="switchTab('feed')">🗺 Map feed</button>
      <button class="tab" onclick="switchTab('report')">＋ Report bump</button>
    </div>

    <!-- FEED -->
    <div id="feed-content" class="tab-content active flex-col" style="flex-direction:column;">
      <div id="feed" style="display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto;flex:1;">
        <div class="empty-feed">
          <div class="icon">🛣️</div>
          <p>Loading bumps…</p>
        </div>
      </div>
    </div>

    <!-- REPORT FORM -->
    <div id="report-content" class="tab-content" style="flex-direction:column;overflow-y:auto;">
      <div id="form-content" style="display:flex;flex-direction:column;padding:20px;gap:16px;">

        <div class="field">
          <div class="form-section-title">📍 Location</div>
          <label>GPS coordinates</label>
          <div class="gps-row">
            <div class="field"><input type="number" id="f-lat" placeholder="Latitude" step="any"></div>
            <div class="field"><input type="number" id="f-lng" placeholder="Longitude" step="any"></div>
            <button id="btn-gps" title="Use my location" onclick="getGPS()">⊕</button>
          </div>
          <p style="font-size:11px;color:var(--grey-4);margin-top:2px;">Or click on the map to pin the exact location.</p>
        </div>

        <div class="field">
          <div class="form-section-title">📊 Details</div>
          <label>Severity</label>
          <select id="f-severity">
            <option value="small">🟢 Small — slight bump</option>
            <option value="medium" selected>🟠 Medium — noticeable bump</option>
            <option value="large">🔴 Large — dangerous bump</option>
          </select>
        </div>

        <div class="field">
          <label>Description <span style="color:var(--grey-4);font-weight:400">(optional)</span></label>
          <textarea id="f-desc" placeholder="e.g. Right after the Carrefour exit, unmarked, very abrupt…"></textarea>
        </div>

        <div class="field">
          <div class="form-section-title">📸 Photo</div>
          <div id="photo-drop">
            <input type="file" id="f-photo" accept="image/*" capture="environment" onchange="previewPhoto(this)">
            <div class="drop-icon">📷</div>
            <p>Tap to take a photo or <strong>choose from gallery</strong></p>
          </div>
          <img id="photo-preview" alt="Preview">
        </div>

        <div id="status"></div>
        <button id="btn-submit" onclick="submitBump()">Report this bump</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Config ──
const SUPABASE_URL = 'https://sfbzwbsurhuqjwsxpfxk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmYnp3YnN1cmh1cWp3c3hwZnhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NDk4MTgsImV4cCI6MjEwNzAyNTgxOH0.gyLOjt0w5h7s5ey4jEn5tvQocuvQ8f4UKokyshvJ-aU';
const CLD_CLOUD  = 'n42r12wm';
const CLD_PRESET = 'bump-signaler-tn';

// ── Supabase helpers ──
async function sbFetch(path, opts={}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(opts.headers||{})
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Map ──
const map = L.map('map', { zoomControl: true }).setView([33.8, 9.5], 7);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© <a href="https://www.esri.com/">Esri</a>',
  maxZoom: 19
}).addTo(map);

let pinMode = false;
let tempMarker = null;
let allMarkers = [];

function makeIcon(severity) {
  const colors = { small: '#2DB87A', medium: '#F08C3A', large: '#E8432D' };
  const c = colors[severity] || colors.medium;
  return L.divIcon({
    className: '',
    html: `<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c};border:2px solid rgba(0,0,0,.4);box-shadow:0 2px 6px rgba(0,0,0,.4)"><div style="transform:rotate(45deg);text-align:center;line-height:18px;font-size:10px">🚧</div></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 22],
    popupAnchor: [0, -24]
  });
}

function addMarker(bump) {
  const m = L.marker([bump.lat, bump.lng], { icon: makeIcon(bump.severity) }).addTo(map);
  const imgHtml = bump.photo_url
    ? `<img src="${bump.photo_url}" class="popup-img" alt="bump photo">`
    : '';
  const sevLabel = { small: '🟢 Small', medium: '🟠 Medium', large: '🔴 Large' }[bump.severity] || bump.severity;
  const date = new Date(bump.created_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  m.bindPopup(`
    <div style="min-width:180px;max-width:220px">
      ${imgHtml}
      <div class="popup-title">${sevLabel} bump</div>
      ${bump.description ? `<div class="popup-desc">${bump.description}</div>` : ''}
      <div class="popup-meta">
        <div class="popup-date">${date}</div>
      </div>
    </div>
  `);
  allMarkers.push(m);
  return m;
}

// Click on map to place pin
map.on('click', (e) => {
  document.getElementById('f-lat').value = e.latlng.lat.toFixed(6);
  document.getElementById('f-lng').value = e.latlng.lng.toFixed(6);
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([e.latlng.lat, e.latlng.lng], {
    icon: L.divIcon({
      className: '',
      html: `<div style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">📍</div>`,
      iconSize: [28,28], iconAnchor: [14,28]
    })
  }).addTo(map);
  // Switch to report tab if on feed
  switchTab('report');
});

// ── Load bumps ──
async function loadBumps() {
  try {
    const data = await sbFetch('/rest/v1/bumps?select=*&order=created_at.desc');
    document.getElementById('count-num').textContent = data.length;

    // Clear markers
    allMarkers.forEach(m => map.removeLayer(m));
    allMarkers = [];

    // Feed
    const feed = document.getElementById('feed');
    if (data.length === 0) {
      feed.innerHTML = `<div class="empty-feed"><div class="icon">🛣️</div><p>No bumps reported yet.<br>Be the first to add one!</p></div>`;
    } else {
      feed.innerHTML = '';
      data.forEach(bump => {
        addMarker(bump);
        const date = new Date(bump.created_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
        const sevClass = { small:'sev-small', medium:'sev-medium', large:'sev-large' }[bump.severity] || 'sev-medium';
        const sevLabel = { small:'Small', medium:'Medium', large:'Large' }[bump.severity] || bump.severity;
        const card = document.createElement('div');
        card.className = 'bump-card';
        card.innerHTML = `
          ${bump.photo_url ? `<img src="${bump.photo_url}" alt="bump" loading="lazy">` : '<div class="no-photo">🚧</div>'}
          <div class="card-body">
            <div class="card-top">
              <span class="severity-badge ${sevClass}">${sevLabel}</span>
              <span class="card-date">${date}</span>
            </div>
            ${bump.description ? `<div class="card-desc">${bump.description}</div>` : ''}
            <div class="card-coords">${Number(bump.lat).toFixed(5)}, ${Number(bump.lng).toFixed(5)}</div>
          </div>
        `;
        card.onclick = () => {
          map.setView([bump.lat, bump.lng], 16);
          // find marker and open popup
          const m = allMarkers.find(mk => {
            const ll = mk.getLatLng();
            return Math.abs(ll.lat - bump.lat) < 0.0001 && Math.abs(ll.lng - bump.lng) < 0.0001;
          });
          if (m) m.openPopup();
          switchTab('feed');
        };
        feed.appendChild(card);
      });
    }
  } catch(e) {
    console.error(e);
  }
}

// ── GPS ──
function getGPS() {
  const btn = document.getElementById('btn-gps');
  btn.textContent = '…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      document.getElementById('f-lat').value = lat.toFixed(6);
      document.getElementById('f-lng').value = lng.toFixed(6);
      map.setView([lat, lng], 16);
      if (tempMarker) map.removeLayer(tempMarker);
      tempMarker = L.marker([lat, lng], {
        icon: L.divIcon({
          className: '',
          html: `<div style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">📍</div>`,
          iconSize: [28,28], iconAnchor: [14,28]
        })
      }).addTo(map);
      btn.textContent = '✓';
      setTimeout(() => btn.textContent = '⊕', 2000);
    },
    err => {
      btn.textContent = '⊕';
      setStatus('Could not get location. Please enter coordinates manually.', 'error');
    }
  );
}

// ── Photo preview ──
function previewPhoto(input) {
  const prev = document.getElementById('photo-preview');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => { prev.src = e.target.result; prev.style.display = 'block'; };
    reader.readAsDataURL(input.files[0]);
  }
}

// ── Upload to Cloudinary ──
async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLD_CLOUD}/image/upload`, { method:'POST', body:fd });
  if (!res.ok) throw new Error('Photo upload failed');
  const data = await res.json();
  return data.secure_url;
}

// ── Submit ──
async function submitBump() {
  const lat = parseFloat(document.getElementById('f-lat').value);
  const lng = parseFloat(document.getElementById('f-lng').value);
  const severity = document.getElementById('f-severity').value;
  const description = document.getElementById('f-desc').value.trim();
  const photoInput = document.getElementById('f-photo');

  if (isNaN(lat) || isNaN(lng)) {
    setStatus('Please set a location — use GPS or click on the map.', 'error'); return;
  }
  if (lat < 30 || lat > 38 || lng < 7 || lng > 12) {
    setStatus('Coordinates seem outside Tunisia. Please check.', 'error'); return;
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;

  try {
    let photo_url = null;
    if (photoInput.files && photoInput.files[0]) {
      setStatus('Uploading photo…', 'info');
      photo_url = await uploadToCloudinary(photoInput.files[0]);
    }

    setStatus('Saving bump…', 'info');
    await sbFetch('/rest/v1/bumps', {
      method: 'POST',
      body: JSON.stringify({ lat, lng, severity, description, photo_url })
    });

    setStatus('✅ Bump reported! Thank you for making Tunisia\'s roads safer.', 'success');
    resetForm();
    await loadBumps();
    setTimeout(() => switchTab('feed'), 1800);
  } catch(e) {
    setStatus('Something went wrong: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function resetForm() {
  ['f-lat','f-lng','f-desc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-severity').value = 'medium';
  document.getElementById('f-photo').value = '';
  document.getElementById('photo-preview').style.display = 'none';
  if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
}

// ── Tabs ──
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0 && tab==='feed') || (i===1 && tab==='report')));
  document.getElementById('feed-content').classList.toggle('active', tab==='feed');
  document.getElementById('report-content').classList.toggle('active', tab==='report');
}

// ── Init ──
loadBumps();
setInterval(loadBumps, 30000); // refresh every 30s
</script>
</body>
</html>
